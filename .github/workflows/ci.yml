name: LockLeaf CI

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze_and_test:
    name: Lint, Analyze, Test & Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Format code with Flutter stable dart format"
            git push origin ${{ github.ref_name }}
          fi

      - name: Run static analysis
        run: |
          set +e
          OUTPUT=$(flutter analyze --fatal-warnings 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            ESCAPED="${OUTPUT//$'\n'/'%0A'}"
            echo "::error title=Flutter Analyze Errors::$ESCAPED"
            exit $EXIT_CODE
          fi

      - name: Run test suite
        shell: bash
        run: |
          set +e
          flutter test --coverage 2>&1 | tee test_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            python3 .github/scripts/report_test_failures.py test_output.log $EXIT_CODE
          fi

      - name: Ensure Android platform files
        shell: bash
        run: |
          mkdir -p /tmp/lockleaf_android_bak
          cp android/app/build.gradle /tmp/lockleaf_android_bak/build.gradle
          cp android/app/src/main/AndroidManifest.xml /tmp/lockleaf_android_bak/AndroidManifest.xml
          cp android/settings.gradle /tmp/lockleaf_android_bak/settings.gradle
          flutter create --platforms=android .
          cp /tmp/lockleaf_android_bak/build.gradle android/app/build.gradle
          cp /tmp/lockleaf_android_bak/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/lockleaf_android_bak/settings.gradle android/settings.gradle

      - name: Build Android Release APK
        shell: bash
        run: |
          set +e
          OUTPUT=$(flutter build apk --release --android-skip-build-dependency-validation 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            CLEAN_OUTPUT=$(echo "$OUTPUT" | tail -n 25 | tr '\r\n' '  ')
            echo "::error title=Android Build Failure::$CLEAN_OUTPUT"
            exit $EXIT_CODE
          fi

      - name: Prepare Android Release APK
        shell: bash
        run: |
          mkdir -p build/app/outputs/flutter-apk/release-dist
          cp "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/release-dist/Lock Leaf.apk"

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LockLeaf-Android-Release-APK
          path: build/app/outputs/flutter-apk/release-dist/Lock Leaf.apk
          if-no-files-found: error
