name: LockLeaf CI

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  analyze_and_test:
    name: Lint, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Format code with Flutter stable dart format"
            git push origin ${{ github.ref_name }}
          fi

      - name: Run static analysis
        run: |
          set +e
          OUTPUT=$(flutter analyze --fatal-warnings 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            ESCAPED="${OUTPUT//$'\n'/'%0A'}"
            echo "::error title=Flutter Analyze Errors::$ESCAPED"
            exit $EXIT_CODE
          fi

      - name: Run test suite
        shell: bash
        run: |
          set +e
          flutter test --coverage 2>&1 | tee test_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            python3 .github/scripts/report_test_failures.py test_output.log $EXIT_CODE
          fi
