name: LockLeaf CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze_and_test:
    name: Lint, Analyze, Test & Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java JDK
        uses: actions/setup-java@3a4f6e1af504cf6f318cfebc8ce0c98d7903b573 # v4.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@f0d5f206b0d1eef81f280e227ea4958de2af6f14 # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze --fatal-warnings

      - name: Run test suite with coverage
        run: flutter test --coverage

      - name: Ensure Android platform files
        shell: bash
        run: |
          mkdir -p /tmp/lockleaf_android_bak
          cp android/app/build.gradle /tmp/lockleaf_android_bak/build.gradle
          cp android/app/src/main/AndroidManifest.xml /tmp/lockleaf_android_bak/AndroidManifest.xml
          cp android/settings.gradle /tmp/lockleaf_android_bak/settings.gradle
          flutter create --platforms=android .
          cp /tmp/lockleaf_android_bak/build.gradle android/app/build.gradle
          cp /tmp/lockleaf_android_bak/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/lockleaf_android_bak/settings.gradle android/settings.gradle

      - name: Build Android Release APK
        shell: bash
        run: |
          set +e
          OUTPUT=$(flutter build apk --release --android-skip-build-dependency-validation 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            CLEAN_OUTPUT=$(echo "$OUTPUT" | tail -n 25 | tr '\r\n' '  ')
            echo "::error title=Android Build Failure::$CLEAN_OUTPUT"
            exit $EXIT_CODE
          fi

      - name: Prepare Android Release APK
        shell: bash
        run: |
          mkdir -p build/app/outputs/flutter-apk/release-dist
          cp "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/release-dist/LockLeaf-release.apk"

      - name: Upload Android Release APK
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf88e # v4.4.3
        with:
          name: LockLeaf-Android-Release-APK
          path: build/app/outputs/flutter-apk/release-dist/LockLeaf-release.apk
          if-no-files-found: error
