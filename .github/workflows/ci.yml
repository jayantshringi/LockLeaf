name: LockLeaf CI

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    name: Lint, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format .

      - name: Run static analysis
        run: |
          set +e
          OUTPUT=$(flutter analyze --fatal-warnings 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            ESCAPED="${OUTPUT//$'\n'/'%0A'}"
            echo "::error title=Flutter Analyze Errors::$ESCAPED"
            exit $EXIT_CODE
          fi

      - name: Run test suite
        run: |
          set +e
          OUTPUT=$(flutter test --coverage 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            ESCAPED="${OUTPUT//$'\n'/'%0A'}"
            echo "::error title=Flutter Test Failures::$ESCAPED"
            exit $EXIT_CODE
          fi

      - name: Verify formatting clean
        run: |
          if ! git diff --quiet; then
            echo "### ⚠️ Files requiring formatting:" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
