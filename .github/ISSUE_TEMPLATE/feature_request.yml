name: Feature Request
description: Suggest an enhancement or new capability for LockLeaf.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify your idea aligns with LockLeaf's core mission: local-first, zero-knowledge password management.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or usability limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: security_impact
    attributes:
      label: Security Considerations
      description: How might this feature impact client-side zero-knowledge guarantees or local cryptographic storage?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
